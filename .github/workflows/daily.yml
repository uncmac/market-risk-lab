# 매일(평일) 장 마감 후 판정 기록 — scripts/daily.py 실행 후 data/ docs/ results/ 커밋
#
# 스케줄 설계
#   * GitHub cron 은 UTC 고정이므로 서머타임(EDT, UTC-4)과 표준시(EST, UTC-5)를 모두 덮도록 후보를 둘 둔다.
#       21:20 UTC → 17:20 EDT / 16:20 EST
#       22:20 UTC → 18:20 EDT / 17:20 EST
#   * gate 잡: 뉴욕 시각이 16:10 이후이고 평일일 때만 통과한다. 위 표대로 두 후보 모두 어느 계절에나
#     16:10 을 넘기므로, "같은 뉴욕 날짜의 daily 커밋이 이미 있으면 건너뜀" 규칙을 더해 하루 한 번만 실행한다.
#     첫 후보가 실패하거나(GitHub 가 스케줄을 누락하는 일도 있다) 아직 커밋이 없으면 두 번째 후보가 대신 뛴다.
#   * workflow_dispatch(수동 실행)는 게이트를 거치지 않는다. 장 마감 전이면 daily.py 가
#     "미완성" 경고와 함께 전일 기준으로 기록한다(ARCHITECTURE.md 스크립트 절).
#   * 커밋 제목은 daily.py 의 스텝 출력 market_status 로 정한다: 오늘 세션을 실제로 기록한 실행(current)만
#     `daily: YYYY-MM-DD` 를 쓰고, 그 밖(incomplete·pre_open·stale·weekend·holiday)은 `daily(<상태>): YYYY-MM-DD` 를 쓴다.
#     그래야 장 마감 전 수동 실행이나 Yahoo 응답이 늦은 21:20 UTC 실행이 그날의 게이트를 잠그지 않고,
#     22:20 UTC 후보(또는 다음 수동 실행)가 마감 봉이 생긴 뒤 그날을 기록할 수 있다.
#   * cron 지연(수십 분 흔함)에도 안전하도록 게이트는 "이후" 조건이지 시간 창이 아니다.
name: daily

on:
  schedule:
    - cron: "20 21,22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

# weekly.yml 과 같은 그룹 — 동시에 둘이 커밋하지 않도록 직렬화. 진행 중인 실행은 취소하지 않는다.
concurrency:
  group: risk-lab
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg

jobs:
  gate:
    name: 실행 게이트 (ET 16:10 이후 · 평일 · 하루 1회)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.gate.outputs.proceed }}
      today_et: ${{ steps.gate.outputs.today_et }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30          # 최근 커밋 제목으로 "오늘 이미 실행됐는가"를 판정하기 위해 얕은 이력 확보

      - id: gate
        name: 뉴욕 시각·요일·중복 실행 확인
        shell: bash
        run: |
          set -euo pipefail
          today_et="$(TZ=America/New_York date +%F)"
          now_et="$(TZ=America/New_York date +%H%M)"
          dow_et="$(TZ=America/New_York date +%u)"      # 1=월 … 7=일
          echo "today_et=${today_et}" >> "$GITHUB_OUTPUT"
          echo "뉴욕 시각 ${today_et} ${now_et} (요일 ${dow_et}) · 이벤트 ${GITHUB_EVENT_NAME}"

          # 최근 커밋 제목 목록 (파이프 대신 변수에 담아 SIGPIPE/pipefail 오판을 피한다; 이력이 비어 있어도 실패하지 않게)
          subjects="$(git log -n 30 --format=%s 2>/dev/null || true)"

          proceed=true
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "수동 실행 — 게이트 생략"
          elif [ "${dow_et}" -gt 5 ]; then
            proceed=false
            echo "주말 — 건너뜀"
          elif [ "$((10#${now_et}))" -lt 1610 ]; then
            proceed=false
            echo "ET 16:10 이전 — 건너뜀"
          elif grep -qxF -- "daily: ${today_et}" <<< "${subjects}"; then
            proceed=false
            echo "오늘(${today_et}) daily 커밋이 이미 있음 — 건너뜀"
          fi
          echo "proceed=${proceed}" >> "$GITHUB_OUTPUT"
          echo "proceed=${proceed}"

  run:
    name: daily.py 실행 및 커밋
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치 (requirements.txt 고정 버전)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - id: daily
        name: scripts/daily.py (캐시 갱신 → 완성 봉 판정 → 장부 → docs/index.html; 출력 asof/market_status/appended)
        run: python scripts/daily.py

      - name: docs/ results/ 커밋 및 푸시 (data/ 는 주간 실행 전용)
        env:
          # 게이트의 정확 일치 grep(-x)은 `daily: <날짜>` 만 인식한다 — 오늘 세션을 기록한 실행(current)만 그 제목을 쓴다.
          COMMIT_MSG: "${{ steps.daily.outputs.market_status == 'current' && format('daily: {0}', needs.gate.outputs.today_et) || format('daily({0}): {1}', steps.daily.outputs.market_status || 'unknown', needs.gate.outputs.today_et) }}"
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 캐시(data/)는 하나의 정합 단위라 부분 커밋이 불가능하다: meta.spy_last 가드(mrl/data.py)와
          # 유령 행·가드 안정성 검사가 close.csv·spy_ohlc.csv 와 묶여 있어, 일부만 커밋한 트리는 load_cache 가
          # RuntimeError 로 거부한다(selftest · 주간 보정·백테스트·Phase 3 산출 · daily --no-update 가 전부 실패).
          # 또 update_daily 는 가격을 전량 재다운로드해 하드컷 지문(_data_sha256)이 매일 바뀌는데
          # results/summary_p2.json 은 주간 실행에서만 갱신된다 → 매일 커밋하면 장부 #2d 증거를 재현할 수 없다.
          # 따라서 data/ 는 build_cache.py 와 summary_p2.json 을 함께 다시 쓰는 주간 실행에서만 통째로 커밋한다.
          for d in docs results; do
            if [ -d "$d" ]; then
              git add -A -- "$d"
            fi
          done
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "${COMMIT_MSG}"
          # 서버 쪽에 새 커밋이 있으면 리베이스(-X theirs = 방금 만든 로컬 커밋 편) 후 푸시. 실패 시 3회 재시도.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "푸시 완료: ${COMMIT_MSG}"
              exit 0
            fi
            echo "푸시 실패 (${attempt}/3) — 리베이스 정리 후 재시도"
            git rebase --abort || true
            sleep 15
          done
          echo "::error::3회 시도 후에도 푸시하지 못했습니다"
          exit 1
