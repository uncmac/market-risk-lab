# 매주 일요일 보정 작업 — 캐시 전량 재구축(build_cache.py) → v0 백테스트(run_backtest_v0.py --variant both)
#                      → Phase 2 보정(run_calibration.py) → 결정층 v1(run_backtest_v1.py --all-configs) → 커밋
#
#   * 13:00 UTC 일요일 = 09:00 EDT / 08:00 EST. 시장이 닫혀 있어 완성 봉만 존재한다.
#   * 가격 캐시는 증분 append 가 아니라 전량 재다운로드(자동조정 재계산 때문, ARCHITECTURE.md 디렉터리 절).
#     fg_history / spy_eod / cboe 는 append — 원천이 과거를 다시 주지 않는다.
#   * daily.yml 과 같은 concurrency 그룹이라 두 워크플로가 동시에 커밋하지 않는다.
#   * 수동 실행 시 variant 를 고를 수 있다(기본 both).
#
#   Phase 2 (ARCHITECTURE_PHASE2.md §14)
#   * run_calibration.py 는 --holdout-final 없이 실행한다 → 모든 입력 프레임을 HOLDOUT_START(2024-09-01) 직전 세션에서 하드컷.
#     --holdout-final 은 워크플로에 넣지 않는다(로컬 1회 수동, 커밋 메시지 `holdout-final: 2b`).
#   * 결정론 게이트: run_calibration.py 가 새로 적합한 라이브 계수를 기존 results/model_p2.json 과 비교한다.
#       - 입력 데이터 지문(SPY OHLC + VIX)이 같고 계수 차 > 1e-9 → exit 1 (파일을 쓰지 않음) → 이 잡은 커밋 단계에 이르지 못한다.
#       - 지문이 다르면(캐시 재구축의 배당 재조정 등) 비교는 결정론 검사가 아니므로 이동 폭을 summary_p2.json.determinism 에 기록·경고하고
#         새 파일을 쓴다(실측: Yahoo 재다운로드의 배당 조정계수 반올림만으로 SPY 상대 ~1.5e-6 → 계수 ~9e-6 이동; CSV 반올림만이면 ~2e-8).
#         1e-4 를 넘으면 '데이터 수정 의심' 경고 → 장부 검토 대상 (손으로 고친 자료는 ≥1e-3 움직인다 — run_calibration.COEF_DRIFT_MATERIAL).
#       - spec_sha256(features/vol/model 소스) 이 다르면 코드 변경 → 새 파일 + run.spec_changed=true + 장부 기재 요구 로그.
#   * 어느 단계든 실패하면 커밋 단계에 이르지 못한다(조용한 실패 금지). timeout-minutes: 60 유지.
#   * 예산(ubuntu 러너): run_calibration.py < 2분(로컬 실측 ~11초), run_backtest_v1.py < 30초(로컬 ~15초).
name: weekly

on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      variant:
        description: "백테스트 변형 (faithful / completed / both)"
        type: choice
        default: both
        options:
          - both
          - faithful
          - completed

permissions:
  contents: write

concurrency:
  group: risk-lab
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  MPLBACKEND: Agg

jobs:
  rebuild:
    name: 캐시 재구축 + v0 백테스트 + Phase 2 보정·결정층 + 커밋
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치 (requirements.txt 고정 버전)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: scripts/build_cache.py (전량 재구축 + append 계열 갱신 + meta.json)
        run: python scripts/build_cache.py

      - name: scripts/run_backtest_v0.py (replay → targets → evaluate → results/ + docs/backtest_v0.html)
        env:
          VARIANT: ${{ github.event.inputs.variant || 'both' }}
        run: python scripts/run_backtest_v0.py --variant "${VARIANT}"

      - name: scripts/run_calibration.py (특징 → walk-forward 사다리 → 검정 → HAR-RV → results/ + docs/calibration_p2.html; 라이브 계수 결정론 검사)
        # 하드컷(--holdout-final 없음). 결정론 검사 실패(exit 1)면 여기서 멈추고 아래 단계·커밋은 실행되지 않는다.
        # --acceptance-rule amended:   VALIDATION.md §8 장부 #2a — 경로 (b) 완화안 (post hoc, 소유자 결정 2026-09-08).
        # --acceptance-blocks both:    VALIDATION.md §8 장부 #2d — 사전 등록된 두 블록 표(24개월·18개월) **모두**에서 통과해야
        #                              배치한다(소유자의 두 번째 결정 2026-09-08). §6 이 블록을 "18~24개월" 로 사전 등록했고
        #                              두 표가 어긋났기 때문이다. 오늘의 결과: deploy_mode=info_only · tone_model=none.
        #                              요구하지 않은 표(1999 시작)는 acceptance.sensitivity_blocks 로 계속 공개된다.
        run: python scripts/run_calibration.py --acceptance-rule amended --acceptance-blocks both

      - name: scripts/run_backtest_v1.py (결정층 → 톤 → v0 와 같은 성적표 → results/ + docs/backtest_v1.html)
        run: python scripts/run_backtest_v1.py --all-configs

      - name: scripts/run_phase3.py (HMM walk-forward → 그림자 멤버·채택 검정 → 비중 백테스트·사다리 → 시나리오 → 킬룰 재현 → results/ + docs/{sizing_p3,regime_p3,track_record}.html; 결정론 검사)
        # ARCHITECTURE_PHASE3.md §12. --holdout-final 은 여기에 **넣지 않는다**(로컬 1회, #2b 와 같은 세션, 커밋 메시지 `holdout-final: 2b`).
        # 하드컷은 기본값(HOLDOUT_START 직전 세션). 결정론 검사 실패면 exit 1 → 아래 게이트·커밋에 이르지 못한다.
        # 예산: 로컬 실측 ~20초(HMM 22회 재적합 · 채택 검정 · 킬룰 재현 223창 · 차트 포함) — 사양의 < 4분 안.
        run: python scripts/run_phase3.py --all-sensitivities

      - name: 결정론 게이트 확인 (summary_p2/p3.json 의 determinism.ok 가 true 가 아니면 커밋하지 않는다)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json, os, sys
          s = json.load(open("results/summary_p2.json", encoding="utf-8"))
          d = s.get("determinism") or {}
          print("determinism(p2):", d.get("status"), "|", d.get("note"))
          if d.get("ok") is not True:
              print("::error::결정론 검사 실패(Phase 2) — 커밋하지 않는다")
              sys.exit(1)
          if d.get("material_drift"):
              print(f"::warning::입력 데이터 변경으로 계수가 {d.get('max_abs_diff'):.2e} 이동(허용 재조정 수준 1e-4 초과) — VALIDATION.md §8 장부 검토 대상")
          if s.get("run", {}).get("spec_changed"):
              print("::warning::spec_sha256 변경(코드 변경) — 장부(VALIDATION.md §8)에 기재하라")

          # Phase 3 (ARCHITECTURE_PHASE3.md §11): θ·Platt 1e-7 · backtest_p3.csv 해시 · 유지 조건 · 자기검사
          p3_path = "results/summary_p3.json"
          if not os.path.exists(p3_path):
              print("::error::results/summary_p3.json 이 없다 — run_phase3.py 가 산출물을 쓰지 못했다")
              sys.exit(1)
          p3 = json.load(open(p3_path, encoding="utf-8"))
          d3 = p3.get("determinism") or {}
          print("determinism(p3):", d3.get("status"), "|", d3.get("note"))
          if d3.get("ok") is not True:
              print("::error::결정론 검사 실패(Phase 3) — 커밋하지 않는다")
              sys.exit(1)
          if d3.get("status") == "data_changed":
              print(f"::warning::입력 지문 변경으로 θ 가 {d3.get('theta_max_abs_diff')} 이동 — 결정론 검사가 아니다(VALIDATION.md §8 검토 대상)")
          if p3.get("run", {}).get("spec_changed"):
              print("::warning::registry_sha/sizing_sha 변경(코드 변경) — 장부(VALIDATION.md §8)에 기재하라")
          st = p3.get("selftest") or {}
          bad = [k for k in ("hmm_param_count_ok", "p2_param_count_ok", "sizing_n_params_ok",
                             "production_shadow_only", "pit_bit_identical") if st.get(k) is False]
          if bad:
              print(f"::error::Phase 3 자기검사 실패 {bad} — 커밋하지 않는다")
              sys.exit(1)
          for f in (p3.get("flags") or []):
              print(f"::warning::Phase 3 플래그 — {f}")
          EOF

      - name: data/ docs/ results/ 커밋 및 푸시
        shell: bash
        run: |
          set -euo pipefail
          today_et="$(TZ=America/New_York date +%F)"
          commit_msg="weekly: ${today_et}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in data docs results; do
            if [ -d "$d" ]; then
              git add -A -- "$d"
            fi
          done
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "${commit_msg}"
          # 서버 쪽에 새 커밋이 있으면 리베이스(-X theirs = 방금 만든 로컬 커밋 편) 후 푸시. 실패 시 3회 재시도.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              echo "푸시 완료: ${commit_msg}"
              exit 0
            fi
            echo "푸시 실패 (${attempt}/3) — 리베이스 정리 후 재시도"
            git rebase --abort || true
            sleep 15
          done
          echo "::error::3회 시도 후에도 푸시하지 못했습니다"
          exit 1
